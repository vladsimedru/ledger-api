upstream ledger {
    server ledger-1:8080;
    server ledger-2:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://ledger;
        proxy_set_header Host $host;
        # Never retry a request on the other instance: retries are the client's job,
        # with the same Idempotency-Key.
        proxy_next_upstream off;
    }
}
