name: ledger

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ledger
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger
      MYSQL_ROOT_PASSWORD: root
    # Needed so the (non-SUPER) ledger user may create the immutability triggers while binlog is on.
    command: ["--log-bin-trust-function-creators=1"]
    # Not published on the host (it would clash with a local MySQL); reach it with
    #   docker compose exec mysql mysql -uledger -pledger ledger
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uledger", "-pledger"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    # The scripts talk to Kafka through `docker compose exec`. Publish 9094 to use a client on the host:
    # ports: ["9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Two instances of the service, to exercise the multi-instance guarantees. One image, built once
  # (run.sh builds it before starting anything).
  ledger-1: &ledger
    image: ledger-api:local
    pull_policy: never
    environment:
      LEDGER_DB_URL: jdbc:mysql://mysql:3306/ledger
      LEDGER_DB_USER: ledger
      LEDGER_DB_PASSWORD: ledger
      LEDGER_KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      timeout: 3s
      retries: 40
    ports:
      - "8081:8080"

  ledger-2:
    <<: *ledger
    ports:
      - "8082:8080"

  # Round-robins requests across both instances on http://localhost:8080 (LEDGER_PORT changes it)
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ledger-1:
        condition: service_healthy
      ledger-2:
        condition: service_healthy
    ports:
      - "${LEDGER_PORT:-8080}:80"

  # Browse topics, messages (including the dead-letter topic) and consumer-group lag on
  # http://localhost:8085 (KAFKA_UI_PORT changes it).
  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: ledger
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: "-Xmx256m"
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
